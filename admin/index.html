<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TypeFab — 注文管理</title>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="../"><span class="brand-mark">t<span>f</span></span>TypeFab</a>
      <h1>注文管理</h1>
      <div class="right"><span id="api-label" class="badge"></span><button id="logout" class="hidden">ログアウト</button></div>
    </header>
    <main class="page">
      <div id="alert" class="banner error hidden" role="alert"></div>
      <section class="card" id="login">
        <h2>管理者トークン</h2>
        <p class="note" style="margin:0 0 10px">Cloudflare Workers の <code>ADMIN_TOKEN</code> を入力します。このブラウザのセッションにのみ保存します。</p>
        <div class="fields"><label>トークン<input id="token" type="password" autocomplete="current-password" /></label><div class="field"><span>&nbsp;</span><button class="primary" id="enter">注文を表示</button></div></div>
      </section>
      <section id="list-view" class="hidden">
        <div class="toolbar" id="filters"></div>
        <p class="note" id="count" style="margin:0 0 10px"></p>
        <div class="orders" id="orders"></div>
      </section>
    </main>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
