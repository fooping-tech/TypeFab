# TypeFab order API — Cloudflare Workers + D1 + R2 + Stripe Checkout.
# Deploy from the repository root:  npx wrangler deploy -c worker/wrangler.toml
name = "typefab-orders"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public site (success/cancel URLs point back here).
SITE_URL = "https://fooping-tech.github.io/TypeFab/"
# Browser origins allowed to call the API (comma separated).
ALLOWED_ORIGINS = "https://fooping-tech.github.io,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173"
# Bulk-order threshold and lead times (days). Prices live in src/pricing.js.
BULK_THRESHOLD = "10"
NORMAL_LEAD_TIME_DAYS = "7"
EXPRESS_LEAD_TIME_DAYS = "3"
# Where "大量注文について問い合わせる" sends people.
CONTACT_URL = "https://github.com/fooping-tech/TypeFab/issues/new?title=%E5%A4%A7%E9%87%8F%E6%B3%A8%E6%96%87%E3%81%AE%E5%95%8F%E3%81%84%E5%90%88%E3%82%8F%E3%81%9B"

# Secrets (never in this file):  npx wrangler secret put <NAME> -c worker/wrangler.toml
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ADMIN_TOKEN
# Local development reads them from worker/.dev.vars (see .dev.vars.example).

[[d1_databases]]
binding = "DB"
database_name = "typefab-orders"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "SVG_BUCKET"
bucket_name = "typefab-order-svgs"
